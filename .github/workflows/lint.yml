name: lint

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    name: check ${{ matrix.python-version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked --group dev

      - name: uv-check-lock-file
        id: uv-check-lock-file
        continue-on-error: true
        run: |
          uv lock --check

      - name: ruff-format
        id: ruff-format
        continue-on-error: true
        run: |
          uv run --locked ruff format --check --diff .

      - name: ruff-check
        id: ruff-check
        continue-on-error: true
        run: |
          uv run --locked ruff check --no-fix --output-format=github .

      - name: pyright
        id: pyright
        continue-on-error: true
        run: |
          uv run --locked pyright .

      - name: mypy
        id: mypy
        continue-on-error: true
        run: |
          uv run --locked mypy .

      - name: Check failure
        env:
          text: "\
            ${{ steps.uv-check-lock-file.outcome == 'failure' && 'check lock file,' || '' }}\
            ${{ steps.ruff-format.outcome == 'failure'        && 'ruff format,'     || '' }}\
            ${{ steps.ruff-check.outcome == 'failure'         && 'ruff check,'      || '' }}\
            ${{ steps.pyright.outcome == 'failure'            && 'pyright,'         || '' }}\
            ${{ steps.mypy.outcome == 'failure'               && 'mypy,'            || '' }}\
            "
        run: |
          if [ -n "${text}" ]; then
            echo "failed: ${text}"
            exit 1
          else
            echo "All success"
          fi
